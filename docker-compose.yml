services:
  postgres:
    image: postgres:16
    container_name: assistencia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistencia
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      TZ: America/Recife
      PGTZ: America/Recife
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d assistencia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: assistencia-api
    container_name: assistencia-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/assistencia
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRACAO: ${JWT_EXPIRACAO:-8h}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-gerente}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
