services:
  postgres:
    image: postgres:16
    container_name: assistencia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistencia
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no arquivo .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      TZ: America/Recife
      PGTZ: America/Recife
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d assistencia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
